<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TrustLens 2.0 — AI-Powered Scam Detection & Digital Safety Platform for India. Detect suspicious messages, scam screenshots, phishing links, and fraudulent payment traps with explainable AI.">
  <title>TrustLens 2.0 — AI-Powered Scam Detection & Digital Safety Platform</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with Custom Dark Cyber Theme -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            slate: {
              850: '#111827',
              900: '#0f172a',
              950: '#070b12'
            }
          }
        }
      }
    };
  </script>

  <!-- Application Custom Styles -->
  <link rel="stylesheet" href="./src/css/app.css">
</head>
<body class="bg-[#070b12] text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500/30 selection:text-cyan-200">

  <!-- Senior Friendly Mode Top Alert Banner -->
  <div id="seniorBannerContainer"></div>

  <!-- Global Navigation Header -->
  <div id="navbarContainer"></div>

  <!-- Main Viewport Router Outlet -->
  <main id="mainContentContainer" class="flex-1 w-full" role="main"></main>

  <!-- Global Footer -->
  <div id="footerContainer"></div>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
